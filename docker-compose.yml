services:
  mongo:
    image: mongo:7
    container_name: lightupgo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-lightupgo}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lightupgo-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-lightupgo}
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lightupgo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 主機 8080 → 容器內 Next.js 3000；容器內保持 3000 是為了不動 Dockerfile / package.json
      - "8080:3000"
    environment:
      # 預設留空，瀏覽器走相對路徑 → 由 Next.js rewrites 代理到 backend；
      # 若要部署到外部網域，可在 .env 設成正式 API 網址（例如 https://api.lightupgo.win）。
      # 注意：用 `-` 而不是 `:-`，這樣空字串會被保留（`:-` 會把空字串視為未設定）。
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      INTERNAL_API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongo-data:
  backend-uploads:
